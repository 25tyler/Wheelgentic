<!doctype html>
<meta charset="utf-8">
<title>Wheelgentic - side by side</title>
<!--
  THE CARTOON AND THE MEASUREMENT IT IS BUILT FROM, AT THE SAME MOMENT.

  Left: Crystal's carechair UI, the real one. Press Showering, Eating or
  Take Meds and our 3D view opens over it, exactly as it does for a person
  using the product.

  Right: scrub3d/live/live_body.py, in its own Rerun viewer. His point
  cloud, his fitted body model, his measurements panel -- the same window he
  gets on the desktop, hosted over HTTP so it can sit beside her UI.

  This used to be a canvas drawing his joint positions, which was a second
  implementation of a thing that already existed. The viewer ships inside
  the rerun-sdk wheel (the installed copy was missing it) and `--serve-web`
  hosts it while accepting the SDK connection on the same gRPC port, so
  live_body.py logs into a browser instead of a desktop window.
-->
<style>
  :root {
    --bg: #0d1017; --panel: #141922; --line: #222a36;
    --ink: #d7dee8; --dim: #7c8798; --live: #57d08a; --stale: #d0a257;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink);
               font: 13px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; }
  .wrap { display: flex; height: 100vh; gap: 1px; background: var(--line); }
  .col { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column;
         background: var(--panel); }
  .body { flex: 1 1 auto; position: relative; min-height: 0; }
  iframe { width: 100%; height: 100%; border: 0; display: block; }
</style>

<div class="wrap">
  <div class="col">
    <div class="body"><iframe src="http://localhost:5173/" title="carechair"></iframe></div>
  </div>

  <div class="col">
    <!-- HIS VIEWER, NOT A DRAWING OF HIS DATA. `rerun --serve-web` hosts the
         same viewer his live view spawns on the desktop, over HTTP, and
         accepts the SDK connection on the same gRPC port. live_body.py logs
         into it and this iframe shows the result: his point cloud, his
         fitted body, his measurements panel.

         Start it with tools/compare.sh, which brings up the viewer, his live
         view against a recording, our backend and the page. -->
    <iframe src="http://127.0.0.1:9090?url=rerun%2Bhttp%3A%2F%2Flocalhost%3A9876%2Fproxy"
            title="live_body.py through the Rerun web viewer"
            allow="cross-origin-isolated"></iframe>
  </div>
</div>

<script>
// Nothing to drive from here: both panels are live applications in their own
// right. Her UI talks to her server, and the Rerun viewer talks to
// live_body.py over gRPC. This page is the frame that holds them side by
// side, and a page that only positions two iframes should not also be
// re-implementing what is inside them.
</script>
